<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Aasha</title>
    <link rel="stylesheet" th:href="@{/css/aasha-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/aasha-reference.css}">
    <script defer th:src="@{/js/aasha-reference.js}"></script>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/" class="header-brand">
                <div class="header-brand-icon">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </div>
                <div>
                    <span class="header-brand-text">Aasha</span>
                    <span class="header-brand-tag">Reunification Network</span>
                </div>
            </a>
        </div>
    </header>

    <main class="container" style="max-width: 480px; margin-top: 60px; padding: 0 24px;">
        <div class="glass-bright" style="padding: 40px; border-radius: 20px;">
            <h1 style="font-family: var(--font-display); font-size: 28px; font-weight: 800; margin-bottom: 8px; text-align: center;">
                Create Account
            </h1>
            <p style="color: var(--ink-sec); text-align: center; margin-bottom: 32px;">
                Join Aasha to help reunite families during disasters
            </p>

            <div th:if="${error}" style="background: #FEE2E2; border: 1px solid #FECACA; border-radius: 12px; padding: 12px 16px; margin-bottom: 24px; color: #991B1B; font-size: 14px;">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/register}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="form-group" style="margin-bottom: 20px;">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" id="name" name="name" class="form-input" placeholder="Enter your full name" required autofocus>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="Min 6 characters" required minlength="6">
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label class="form-label" for="phone">WhatsApp Number *</label>
                    <input type="tel" id="phone" name="phone" class="form-input" placeholder="+91 98765 43210" required>
                    <p style="font-size: 12px; color: var(--ink-muted); margin-top: 4px;">We'll notify you on WhatsApp when a match is found</p>
                </div>

                <div class="form-group" style="margin-bottom: 32px;">
                    <label class="form-label" for="role">I am a</label>
                    <select id="role" name="role" class="form-input" required>
                        <option value="user">Citizen — Looking for a missing person</option>
                        <option value="official">Official — Relief camp officer / Volunteer</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 16px; font-weight: 600;">
                    Create Account
                </button>
            </form>

            <p style="text-align: center; margin-top: 24px; color: var(--ink-sec); font-size: 14px;">
                Already have an account? 
                <a href="/login" style="color: var(--saffron); font-weight: 600; text-decoration: none;">Sign in</a>
            </p>
        </div>
    </main>
</body>
</html>
