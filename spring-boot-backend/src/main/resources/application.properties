server.port=8080
spring.thymeleaf.cache=false
server.error.include-message=always
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
logging.level.org.thymeleaf=ERROR

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/aasha?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Uday@2006}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Migrations 7-15 were applied from files that are no longer in the repo;
# ignore them during validation so boot does not fail.
spring.flyway.validate-on-migrate=false
spring.flyway.ignore-migration-patterns=*:missing

# JWT
jwt.secret=${JWT_SECRET:aasha-disaster-connect-secret-key-must-be-at-least-256-bits-long-for-hs256}
jwt.expiration=86400000

# API base URL for Flutter app
api.base-url=${API_BASE_URL:http://localhost:8080}
matching.ai-url=${MATCHING_AI_URL:http://localhost:8000/api/v1/match}
matching.candidate-pool-size=${MATCHING_CANDIDATE_POOL_SIZE:100}
matching.age-tolerance=${MATCHING_AGE_TOLERANCE:5}

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://127.0.0.1:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:aasha-photos}

# n8n WhatsApp Notification
n8n.webhook-url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/aasha-whatsapp}
n8n.webhook.url=${n8n.webhook-url}
